const app=$("#app"), scenesEl=$("#scenes"), toastEl=$("#toast");
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

/* -------------------- MUSIC (AUTO-PLAY + UNLOCK FALLBACK) -------------------- */
let audio = null;

function initMusic() {
  if (!CONFIG.music.enabled || !CONFIG.music.source) return;
  audio = new Audio(CONFIG.music.source);
  audio.loop = CONFIG.music.loop;
  audio.volume = 0;
  
  audio.addEventListener("error", () => toast("Music asset unavailable — the experience continues quietly."));

  // Attempt automatic background playback right away
  attemptAutoplay();

  // Fallback: If autoplay policy blocks it, start on first tap/click anywhere
  const unlockAudio = () => {
    startMusic();
    document.removeEventListener("click", unlockAudio);
    document.removeEventListener("touchstart", unlockAudio);
  };
  document.addEventListener("click", unlockAudio);
  document.addEventListener("touchstart", unlockAudio);
}

function attemptAutoplay() {
  if (!audio) return;
  audio.play()
    .then(() => fadeVolume(CONFIG.music.volume, CONFIG.music.fadeIn))
    .catch(() => {
      // Browser blocked autoplay; waiting for first interaction fallback
    });
}

function startMusic() {
  if (!audio) return;
  if (audio.paused) {
    audio.play()
      .then(() => fadeVolume(CONFIG.music.volume, CONFIG.music.fadeIn))
      .catch(() => {});
  }
}

function fadeVolume(to,ms){
  if(!audio)return;const from=audio.volume,start=performance.now();
  const tick=now=>{const p=clamp((now-start)/ms,0,1);audio.volume=from+(to-from)*p;if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)
}
$("#musicBtn").addEventListener("click",()=>{state.muted=!state.muted;if(state.muted){if(audio)audio.pause();$("#musicBtn").textContent="×"}else{startMusic();$("#musicBtn").textContent="♪"}});

function resize(){
  W=innerWidth;H=innerHeight;[space,dust,fx].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";});
  ctx.setTransform(dpr,0,0,dpr,0,0);dctx.setTransform(dpr,0,0,dpr,0,0);fctx.setTransform(dpr,0,0,dpr,0,0);
  makeStars();
}
function makeStars(){
  const mobile=W<700,count=Math.round(CONFIG.effects.starCount*(mobile?CONFIG.performance.mobileParticleDensity==="low"?.45:.7:1));
  stars=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,z:.15+Math.random()*.85,r:.35+Math.random()*1.45,a:.25+Math.random()*.75,p:Math.random()*6.28}));
}
function drawSpace(t){
  ctx.clearRect(0,0,W,H);
  const par=CONFIG.effects.parallax?state.mx||0:0,my=state.my||0;
  for(const s of stars){
    const tw=.55+.45*Math.sin(t*.0015+s.p);
    let x=s.x+par*s.z*35,y=s.y+my*s.z*35;
    if(x<-10)x=W+10;if(x>W+10)x=-10;if(y<-10)y=H+10;if(y>H+10)y=-10;
    ctx.globalAlpha=s.a*tw;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,s.r*s.z,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(CONFIG.effects.shootingStars&&Math.random()<.018)shooters.push({x:Math.random()*W*.8,y:Math.random()*H*.35,v:7+Math.random()*8,l:80+Math.random()*120,a:1});
  shooters.forEach(s=>{s.x+=s.v;s.y+=s.v*.35;s.a-=.012;ctx.globalAlpha=Math.max(0,s.a);ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.l,s.y-s.l*.35);ctx.stroke()});
  shooters=shooters.filter(s=>s.a>0);requestAnimationFrame(drawSpace)
}
function drawDust(t){
  dctx.clearRect(0,0,W,H);
  for(let i=0;i<70;i++){let x=(i*97+t*.008)%W,y=(i*53+Math.sin(t*.0004+i)*40)%H;dctx.globalAlpha=.03;dctx.fillStyle=CONFIG.theme.accent;dctx.fillRect(x,y,1,1)}
  requestAnimationFrame(drawDust)
}
state.mx=0;state.my=0;
addEventListener("mousemove",e=>{state.mx=(e.clientX/W-.5)*2;state.my=(e.clientY/H-.5)*2;$("#cursor").style.left=e.clientX+"px";$("#cursor").style.top=e.clientY+"px"});
addEventListener("resize",resize);resize();requestAnimationFrame(drawSpace);requestAnimationFrame(drawDust);

/* -------------------- SCENE GENERATION -------------------- */
function sceneShell(id,inner){
  const el=document.createElement("section");el.className="scene";el.dataset.id=id;el.innerHTML=inner;return el
}
function heading(s,eyebrow=""){
  return `${eyebrow?`<div class="eyebrow reveal">${esc(eyebrow)}</div>`:""}<h2 class="reveal d2">${esc(s.title||"")}</h2>${s.subtitle?`<p class="lead reveal d3">${esc(s.subtitle)}</p>`:""}`
}
function buildScenes(){
  state.scenes=enabledScenes();scenesEl.innerHTML="";
  if(CONFIG.opening.enabled){
    scenesEl.append(sceneShell("opening",`<div class="content"><div class="eyebrow reveal">${esc(CONFIG.opening.eyebrow)}</div><h1 class="reveal d2">${esc(CONFIG.opening.title)}</h1><p class="lead reveal d3">${esc(CONFIG.opening.subtitle)}</p><p class="lead reveal d4">${esc(CONFIG.opening.description)}</p><button class="cta reveal d4" id="openBtn">${esc(CONFIG.opening.buttonText)}</button></div>`));
  }
  if(CONFIG.challenge.enabled)scenesEl.append(sceneShell("challenge",`<div class="content"><div class="challenge glass"><div class="eyebrow">A small challenge</div><h2>Before the next door opens</h2><div class="question">${esc(CONFIG.challenge.question)}</div><input id="answer" inputmode="decimal" autocomplete="off" aria-label="Challenge answer"><div class="actions"><button class="cta" id="checkAnswer">Unlock</button><button class="cta ghost" id="hintBtn">Hint</button></div><div id="challengeStatus" class="status"></div><div class="hint" id="hint"></div></div></div>`));
  const m=CONFIG.scenes.find(s=>s.id==="mystery"); if(m)scenesEl.append(sceneShell("mystery",`<div class="content">${heading(m,CONFIG.mystery.enabled?"The clue":"")}${CONFIG.mystery.messages.map((x,i)=>`<p class="lead reveal d${Math.min(2+i,4)}">${esc(x)}</p>`).join("")}<button class="cta" data-next>Continue</button></div>`));
  const u=CONFIG.scenes.find(s=>s.id==="universe"); if(u)scenesEl.append(sceneShell("universe",`<div class="content">${heading(u,"Constellation")}<div class="constellation" id="constellation"><svg id="constellationSvg"></svg></div><p class="hint">Some stars can be touched.</p></div>`));
  const mm=CONFIG.scenes.find(s=>s.id==="memories"); if(mm)scenesEl.append(sceneShell("memories",`<div class="content">${heading(mm,"Memory Garden")}<div class="memory-wrap">${CONFIG.memories.map((x,i)=>`<article class="card glass memory-card" data-memory="${i}">${x.image?`<img loading="lazy" src="${esc(x.image)}" onload="this.closest('.card').classList.add('loaded')" onerror="this.remove()">`:""}<div class="card-body"><div class="meta">${esc(x.date)} ${x.location?" · "+esc(x.location):""}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div></article>`).join("")}</div></div>`));
  const g=CONFIG.scenes.find(s=>s.id==="gallery"); if(g)scenesEl.append(sceneShell("gallery",`<div class="content">${heading(g,"Photo Journey")}<div id="galleryStage"></div></div>`));
  const r=CONFIG.scenes.find(s=>s.id==="reasons"); if(r)scenesEl.append(sceneShell("reasons",`<div class="content">${heading(r,"A few reasons")}<div class="reason-grid">${CONFIG.reasons.map(x=>`<article class="reason glass"><div class="meta">Because…</div><h3>${esc(x.title)}</h3><p class="lead">${esc(x.text)}</p></article>`).join("")}</div></div>`));
  const q=CONFIG.scenes.find(s=>s.id==="quiz"); if(q)scenesEl.append(sceneShell("quiz",`<div class="content">${heading(q,"Quiz 2.0")}<div class="quiz-card glass" id="quizBox"></div></div>`));
  const c=CONFIG.scenes.find(s=>s.id==="counter"); if(c)scenesEl.append(sceneShell("counter",`<div class="content">${heading(c,"Our Time")}<div class="counter" id="counterBox"></div><div id="totalDays" class="hint"></div></div>`));
  const f=CONFIG.scenes.find(s=>s.id==="future"); if(f)scenesEl.append(sceneShell("future",`<div class="content">${heading(f,"The Future")}<div class="future-grid">${CONFIG.future.cards.map(x=>`<article class="future glass"><div class="meta">${esc(x.icon||"✦")}</div><h3>${esc(x.title)}</h3><p class="lead">${esc(x.description)}</p></article>`).join("")}</div></div>`));
  const ls=CONFIG.scenes.find(s=>s.id==="letters"); if(ls)scenesEl.append(sceneShell("letters",`<div class="content">${heading(ls,"Open When…")}<div class="reason-grid">${CONFIG.letters.map((x,i)=>`<button class="reason glass letter-choice" data-letter="${i}"><div class="meta">A letter for later</div><h3>${esc(x.title)}</h3><p class="lead">Tap to read</p></button>`).join("")}</div></div>`));
  const le=CONFIG.scenes.find(s=>s.id==="letter"); if(le)scenesEl.append(sceneShell("letter",`<div class="content">${heading(le,"A Letter")}<div class="letter" id="mainLetter"><div class="envelope glass"><div class="paper"><h3>${esc(CONFIG.letter.title)}</h3><p class="letter-text" id="letterText">${esc(CONFIG.letter.text)}</p><p>${esc(CONFIG.letter.signature)}</p></div><div class="seal">✦</div></div><button class="cta" id="openLetter">Open</button></div></div>`));
  const rv=CONFIG.scenes.find(s=>s.id==="reveal"); if(rv)scenesEl.append(sceneShell("reveal",`<div class="content"><div class="eyebrow reveal">${esc(CONFIG.finalReveal.title)}</div><h2 class="reveal d2">${esc(CONFIG.finalReveal.subtitle)}</h2><p class="lead reveal d3">${esc(CONFIG.mystery.clues[0]||"")}</p><button class="cta reveal d4" id="revealBtn">Continue</button></div>`));
  const fi=CONFIG.scenes.find(s=>s.id==="final"); if(fi)scenesEl.append(sceneShell("final",`<div class="content"><div class="eyebrow">${esc(CONFIG.finalReveal.nameReveal||CONFIG.general.partnerName)}</div><div class="final-heart">${esc(CONFIG.finalReveal.heartSymbol)}</div><h2 class="final-name">${esc(CONFIG.finalReveal.line1)}</h2><h2>${esc(CONFIG.finalReveal.line2)}</h2><p class="lead">${esc(CONFIG.finalReveal.message)}</p><p class="lead">${esc(CONFIG.finalReveal.closingText)}</p><p>${esc(CONFIG.finalReveal.signature)}</p><button class="cta replay" id="replayBtn">${esc(CONFIG.finalReveal.replayText)}</button></div>`));
  if(CONFIG.opening.enabled)state.scenes.unshift({id:"opening"}); if(CONFIG.challenge.enabled)state.scenes.splice(CONFIG.opening.enabled?1:0,0,{id:"challenge"});
  bindSceneEvents();updateUI();renderGallery();renderQuiz();renderCounter();renderConstellation();
}
function bindSceneEvents(){
  $("#openBtn")?.addEventListener("click",()=>{state.started=true;startMusic();sound(CONFIG.sounds.click);goNext()});
  $("#checkAnswer")?.addEventListener("click",checkChallenge);
  $("#answer")?.addEventListener("keydown",e=>{if(e.key==="Enter")checkChallenge()});
  $("#hintBtn")?.addEventListener("click",()=>{$("#hint").textContent=CONFIG.challenge.hint});
  document.querySelectorAll("[data-next]").forEach(b=>b.addEventListener("click",goNext));
  document.querySelectorAll(".memory-card").forEach(c=>c.addEventListener("click",()=>openMemory(+c.dataset.memory)));
  document.querySelectorAll(".letter-choice").forEach(b=>b.addEventListener("click",()=>{toast(CONFIG.letters[+b.dataset.letter].text);sound(CONFIG.sounds.memory)}));
  $("#openLetter")?.addEventListener("click",()=>{const l=$("#mainLetter");l.classList.toggle("open");sound(CONFIG.sounds.click);if(l.classList.contains("open"))$("#openLetter").textContent="Close"});
  $("#revealBtn")?.addEventListener("click",()=>{goNext();celebrate()});
  $("#replayBtn")?.addEventListener("click",()=>location.reload());
}
function currentEl(){return [...scenesEl.children].find((_,i)=>i===state.scene)}
function goTo(i){
  i=clamp(i,0,state.scenes.length-1);const old=currentEl();state.scene=i;
  [...scenesEl.children].forEach((el,n)=>el.classList.toggle("active",n===i));
  updateUI();if(old&&old!==currentEl())old.classList.add("exit");setTimeout(()=>old?.classList.remove("exit"),1200);
  const id=state.scenes[i]?.id;if(id==="final")celebrate();if(id==="counter")renderCounter();
}
function goNext(){goTo(state.scene+1)}
function goPrev(){goTo(state.scene-1)}
function updateUI(){
  $("#sceneNum").textContent=String(state.scene+1).padStart(2,"0");
  $("#sceneTotal").textContent=String(state.scenes.length).padStart(2,"0");
  $("#progressLine").style.width=((state.scene)/(state.scenes.length-1)*100)+"%";
}
function checkChallenge(){
  const input=$("#answer");if(!input)return;
  const val=input.value.trim().replace(/,/g,"");
  const ok=CONFIG.challenge.type==="integration"?Number(val)===Number(CONFIG.challenge.correctAnswer):val.toLowerCase()===String(CONFIG.challenge.correctAnswer).toLowerCase();
  const s=$("#challengeStatus");
  if(ok){state.challengeSolved=true;s.className="status success";s.textContent=CONFIG.challenge.successMessage;sound(CONFIG.sounds.success);fxBurst(W/2,H/2);setTimeout(goNext,1300)}
  else{s.className="status error";s.textContent=CONFIG.challenge.failureMessage;input.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:260});sound(CONFIG.sounds.click)}
}
function openMemory(i){
  const m=CONFIG.memories[i];sound(CONFIG.sounds.memory);
  const img=m.image?`<img src="${esc(m.image)}" style="width:100%;max-height:52vh;object-fit:contain;border-radius:18px" onerror="this.remove()">`:"";
  const box=document.createElement("div");box.className="scene active";box.style.zIndex=80;box.innerHTML=`<div class="content"><div class="glass" style="padding:25px;border-radius:25px">${img}<div class="meta">${esc(m.date)} ${m.location?" · "+esc(m.location):""}</div><h2>${esc(m.title)}</h2><p class="lead">${esc(m.text)}</p>${m.quote?`<p class="lead">“${esc(m.quote)}”</p>`:""}<button class="cta" id="closeMem">Return</button></div></div>`;
  scenesEl.append(box);$("#closeMem").onclick=()=>box.remove();
}

/* -------------------- GALLERY -------------------- */
let galleryIndex=0;
function renderGallery(){
  const stage=$("#galleryStage");if(!stage||!CONFIG.photos.length)return;
  const p=CONFIG.photos[galleryIndex%CONFIG.photos.length];
  stage.innerHTML=`<div class="photo-stage"><img src="${esc(p.src)}" alt="${esc(p.title)}" onerror="this.style.display='none'"><div class="glass" style="margin:14px auto 0;width:min(90%,600px);padding:16px;border-radius:18px"><div class="meta">${esc(p.date)} ${p.location?" · "+esc(p.location):""}</div><h3>${esc(p.title)}</h3><p class="lead">${esc(p.caption)}</p></div><div class="actions"><button class="cta" id="prevPhoto">‹</button><button class="cta" id="nextPhoto">›</button></div></div>`;
  $("#prevPhoto").onclick=()=>{galleryIndex=(galleryIndex-1+CONFIG.photos.length)%CONFIG.photos.length;renderGallery()};
  $("#nextPhoto").onclick=()=>{galleryIndex=(galleryIndex+1)%CONFIG.photos.length;renderGallery()};
}

/* -------------------- QUIZ (EVERY OPTION CORRECT) -------------------- */
function renderQuiz(){
  const box=$("#quizBox");if(!box)return;
  if(state.quizIndex>=CONFIG.quiz.length){box.innerHTML=`<div class="result">${esc(`You scored ${state.quizScore}/${CONFIG.quiz.length}.`)}</div><p class="lead">But there is one question you can never get wrong.</p><h3>Would I choose you again?</h3><p class="result">Every single time.</p><button class="cta" id="quizContinue">Continue</button>`;$("#quizContinue").onclick=goNext;return}
  const q=CONFIG.quiz[state.quizIndex];
  box.innerHTML=`<div class="meta">Question ${state.quizIndex+1} / ${CONFIG.quiz.length}</div><h3>${esc(q.question)}</h3><div class="quiz-options">${q.options.map((o,i)=>`<button class="choice" data-q="${i}">${esc(o)}</button>`).join("")}</div><div id="quizStatus" class="status"></div>`;
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const selectedIdx = +b.dataset.q;
    const isGood = Array.isArray(q.answer) ? q.answer.includes(selectedIdx) : selectedIdx === q.answer;
    
    if(isGood){
      state.quizScore++;
      $("#quizStatus").className="status success";
      $("#quizStatus").textContent="You remembered.";
      sound(CONFIG.sounds.success);
    } else {
      $("#quizStatus").className="status error";
      $("#quizStatus").textContent="Close… but not quite.";
    }
    setTimeout(()=>{state.quizIndex++;renderQuiz()},650);
  });
}

/* -------------------- COUNTER -------------------- */
function renderCounter(){
  const box=$("#counterBox");if(!box)return;const start=new Date(`${CONFIG.relationship.startDate}T${CONFIG.relationship.startTime||"00:00"}:00`);
  const now=new Date();let diff=Math.max(0,now-start),sec=Math.floor(diff/1000);
  const days=Math.floor(sec/86400);sec%=86400;const hours=Math.floor(sec/3600);sec%=3600;const mins=Math.floor(sec/60);sec%=60;
  const years=now.getFullYear()-start.getFullYear()-((now.getMonth()<start.getMonth()||(now.getMonth()===start.getMonth()&&now.getDate()<start.getDate()))?1:0);
  const anchor=new Date(start);anchor.setFullYear(start.getFullYear()+years);let rem=Math.max(0,now-anchor),rd=Math.floor(rem/86400000);let values={years,months:Math.floor(rd/30),days:rd,hours,minutes:mins,seconds:sec};
  box.innerHTML=CONFIG.counter.units.map(u=>`<div class="unit glass"><strong>${values[u]??0}</strong><span>${u}</span></div>`).join("");
  if(CONFIG.counter.showTotalDays)$("#totalDays").textContent=`That is approximately ${Math.floor((now-start)/86400000).toLocaleString()} total days together.`;
}
setInterval(()=>{if(state.scenes[state.scene]?.id==="counter")renderCounter()},1000);

/* -------------------- CONSTELLATION -------------------- */
function renderConstellation(){
  const box=$("#constellation"),svg=$("#constellationSvg");if(!box||!svg)return;
  const ms=CONFIG.memories, pts=ms.map(m=>({x:m.coordinates?.x??Math.random()*80+10,y:m.coordinates?.y??Math.random()*70+15}));
  svg.innerHTML=pts.slice(0,-1).map((p,i)=>`<line x1="${p.x}%" y1="${p.y}%" x2="${pts[i+1].x}%" y2="${pts[i+1].y}%"/>`).join("");
  pts.forEach((p,i)=>{const s=document.createElement("button");s.className="star";s.style.left=p.x+"%";s.style.top=p.y+"%";s.setAttribute("aria-label",ms[i].title);s.title=ms[i].title;s.onclick=()=>openMemory(i);box.append(s)})
}

/* -------------------- FINAL FX -------------------- */
let particles=[];
function fxBurst(x,y){
  for(let i=0;i<130;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*7;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,s:.8+Math.random()*2})}
}
function celebrate(){
  if(!CONFIG.finalReveal.effects.particles)return;fxBurst(W/2,H/2);
  for(let i=0;i<80;i++)particles.push({x:W/2,y:H/2,vx:(Math.random()-.5)*9,vy:(Math.random()-.7)*9,life:1,s:1+Math.random()*3,heart:true})
}
function drawFX(){
  fctx.clearRect(0,0,W,H);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.life-=.014;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=Math.random()>.5?CONFIG.theme.primary:CONFIG.theme.accent;if(p.heart){fctx.font=`${10*p.s}px serif`;fctx.fillText("♥",p.x,p.y)}else{fctx.beginPath();fctx.arc(p.x,p.y,p.s,0,Math.PI*2);fctx.fill()}});
  particles=particles.filter(p=>p.life>0);fctx.globalAlpha=1;requestAnimationFrame(drawFX)
}
requestAnimationFrame(drawFX);

/* -------------------- NAVIGATION / EASTER EGGS -------------------- */
let wheelLock=false;
addEventListener("wheel",e=>{
  if(wheelLock||e.deltaY===0)return;wheelLock=true;
  e.deltaY>0?goNext():goPrev();setTimeout(()=>wheelLock=false,850)
},{passive:true});
let touchY=0;addEventListener("touchstart",e=>touchY=e.touches[0].clientY,{passive:true});
addEventListener("touchend",e=>{const dy=touchY-e.changedTouches[0].clientY;if(Math.abs(dy)>55){dy>0?goNext():goPrev()}},{passive:true});
addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowRight"||e.key===" "){e.preventDefault();goNext()}if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();goPrev()}});
document.addEventListener("dblclick",e=>{if(e.target.closest("#app")){const egg=CONFIG.easterEggs.find(x=>x.type==="doubleclick");if(egg)toast(egg.message)}});

/* -------------------- INITIALIZE -------------------- */
initMusic();buildScenes();goTo(0);
if(CONFIG.progress.rememberLastScene){const saved=+localStorage.getItem("loveScene");if(saved>0)goTo(clamp(saved,0,state.scenes.length-1))}
addEventListener("beforeunload",()=>{if(CONFIG.progress.rememberLastScene)localStorage.setItem("loveScene",state.scene)});
</script>
</body>
